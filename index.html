<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ea580c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Sai Fome - Hamburgueria & Delivery em Dois Córregos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #111111;
            color: #f3f4f6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        h1, h2, h3, .price-tag, .brand-font {
            font-family: 'Oswald', sans-serif;
        }

        input, select, textarea {
            font-size: 16px !important;
        }
        @media (min-width: 640px) {
            input, select, textarea {
                font-size: 14px !important;
            }
        }

        .burger-card {
            background-color: #1a1a1a;
            transition: all 0.25s ease;
            border: 1px solid #27272a;
        }

        @media (hover: hover) {
            .burger-card:hover {
                transform: translateY(-6px);
                box-shadow: 0 16px 25px -5px rgba(249, 115, 22, 0.25);
                border-color: #f97316;
            }
        }

        .hero-section {
            background: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
            position: relative;
            overflow: hidden;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        @media (max-width: 640px) {
            .modal-overlay {
                padding: 0;
                align-items: flex-end;
            }
            .modal-card-mobile {
                border-bottom-left-radius: 0 !important;
                border-bottom-right-radius: 0 !important;
                border-top-left-radius: 1.5rem !important;
                border-top-right-radius: 1.5rem !important;
                max-height: 92vh !important;
                width: 100% !important;
            }
        }

        .cart-drawer {
            position: fixed;
            top: 0; right: -100%;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: #18181b;
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.9);
            border-left: 1px solid #27272a;
            z-index: 2100;
            display: flex;
            flex-direction: column;
            transition: right 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        @media (min-width: 641px) {
            .cart-drawer {
                right: -520px;
            }
        }

        .cart-drawer.open {
            right: 0 !important;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #111;
        }
        ::-webkit-scrollbar-thumb {
            background: #f97316;
            border-radius: 999px;
        }

        .toast-box {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1f2937;
            border: 1px solid #f97316;
            color: #fff;
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .toast-box.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="antialiased">

    <!-- Navbar -->
    <nav class="bg-[#0a0a0a]/95 backdrop-blur-md fixed w-full z-50 border-b border-orange-500/30">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 sm:h-20">
                <span class="text-2xl sm:text-3xl font-extrabold tracking-tight brand-font flex items-center gap-1 leading-none cursor-pointer" onclick="window.scrollTo({top:0, behavior:'smooth'})">
                    <span class="text-green-600">Sai</span>
                    <span class="text-orange-500 flex items-center gap-1">Fome <i class="fa-solid fa-burger text-orange-500 text-lg sm:text-xl"></i></span>
                </span>
                <div class="flex items-center gap-2 sm:gap-3">
                    <button onclick="openHistoryModal()" class="flex items-center gap-1.5 bg-gray-900 hover:bg-gray-800 text-gray-300 hover:text-white px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-full text-xs font-semibold border border-gray-800">
                        <i class="fa-solid fa-clock-rotate-left text-orange-500"></i>
                        <span>Pedidos Salvos</span>
                        <span id="nav-saved-count" class="bg-orange-500 text-black font-bold px-1.5 py-0.5 rounded-full text-[10px]">0</span>
                    </button>
                    <button onclick="openCart()" class="bg-orange-500 hover:bg-orange-600 text-black font-extrabold px-3 sm:px-4 py-1.5 sm:py-2 rounded-full flex items-center gap-1.5 sm:gap-2 text-xs sm:text-sm">
                        <i class="fa-solid fa-bag-shopping"></i>
                        <span>Sacola</span>
                        <span id="cart-badge-count" class="bg-black text-white text-[11px] sm:text-xs px-1.5 sm:px-2 py-0.5 rounded-full">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content / Menu -->
    <main id="cardapio" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-28">
        <div class="text-center mb-10">
            <h2 class="text-4xl md:text-5xl font-bold text-white uppercase tracking-wide mb-3">
                Nosso <span class="text-orange-500">Cardápio</span>
            </h2>
            <div class="w-24 h-1 bg-green-600 mx-auto rounded mb-4"></div>
        </div>
        <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Renderizado dinamicamente -->
        </div>
    </main>

    <!-- MODAL DE PERSONALIZAÇÃO -->
    <div id="customize-modal" class="modal-overlay">
        <div class="modal-card-mobile bg-[#18181b] border border-gray-800 rounded-2xl max-w-xl w-full max-h-[90vh] overflow-y-auto shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-black/70 hover:bg-red-600 text-white w-9 h-9 rounded-full flex items-center justify-center text-lg z-20">✕</button>
            <div class="relative h-60 overflow-hidden">
                <img id="modal-img" src="" alt="" class="w-full h-full object-cover">
                <div id="modal-badge-container" class="absolute top-4 left-4"></div>
            </div>
            <div class="p-6">
                <div class="flex justify-between items-start mb-2">
                    <h3 id="modal-title" class="text-3xl font-bold text-white brand-font uppercase"></h3>
                    <span id="modal-base-price" class="text-2xl font-bold text-orange-500 brand-font"></span>
                </div>
                <p id="modal-desc" class="text-gray-400 text-sm mb-6"></p>
                <div id="modal-dynamic-options" class="space-y-6"></div>
            </div>
            <div class="bg-[#111111] p-4 px-6 border-t border-gray-800 flex items-center justify-between gap-4 sticky bottom-0 z-30">
                <div class="flex items-center gap-3 bg-black/60 border border-gray-700 rounded-xl px-3 py-1.5">
                    <button onclick="changeModalQty(-1)" class="text-white text-xl font-bold px-2">-</button>
                    <span id="modal-qty" class="text-white font-bold text-base">1</span>
                    <button onclick="changeModalQty(1)" class="text-white text-xl font-bold px-2">+</button>
                </div>
                <button onclick="confirmAddToCart()" class="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-3.5 px-6 rounded-xl flex items-center justify-between text-base">
                    <span>Adicionar à Sacola</span>
                    <span id="modal-total-price" class="brand-font text-lg font-extrabold text-orange-300"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- CARRINHO -->
    <div id="cart-drawer" class="cart-drawer">
        <div class="p-5 border-b border-gray-800 flex items-center justify-between bg-black/40">
            <h3 class="text-xl font-bold text-white brand-font">Sua Sacola</h3>
            <button onclick="closeCart()" class="text-gray-400 hover:text-white text-xl">✕</button>
        </div>
        <div class="flex-1 overflow-y-auto p-5 space-y-6">
            <div id="cart-items-container" class="space-y-3"></div>
        </div>
    </div>

    <div id="toast" class="toast-box"></div>

    <script>
        const WHATSAPP_NUMBER = "5514997731523";

        const MENU_ITEMS = [
            {
                id: "original",
                name: "Original",
                category: "lanches",
                badge: "CLÁSSICO",
                price: 25.90,
                image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800&q=80",
                ingredients: "Carne 100% bovina, queijo, alface, tomate, cebola roxa, ketchup, mostarda e maionese.",
                removableIngredients: ["Cebola Roxa", "Tomate", "Maionese", "Queijo"]
            },
            {
                id: "turbinado",
                name: "Turbinado",
                category: "lanches",
                badge: "🔥 O MAIS PEDIDO 🔥",
                isFeatured: true,
                price: 42.90,
                image: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=800&q=80",
                ingredients: "Carne monstruosa de 200g, bacon, queijo, cheddar, alface, tomate, cebola roxa.",
                removableIngredients: ["Bacon", "Cheddar", "Tomate"]
            },
            {
                id: "coca_lata_tradicional",
                name: "Coca-Cola Lata 350ml Tradicional",
                category: "bebidas",
                badge: "GELADA 🧊",
                price: 7.00,
                image: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=800&q=80",
                ingredients: "Lata 350ml clássica, trincando de gelada.",
                isDrink: true
            }
        ];

        let cart = [];
        let currentModalItem = null;
        let currentQuantity = 1;
        let currentExtraMeat = 0;

        function formatBRL(val) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
        }

        function renderMenu() {
            const container = document.getElementById('menu-grid');
            if (!container) return;

            container.innerHTML = MENU_ITEMS.map(item => `
                <div class="burger-card rounded-2xl overflow-hidden flex flex-col h-full">
                    <div class="relative h-64 overflow-hidden">
                        <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-6 flex flex-col flex-grow">
                        <h3 class="text-2xl font-bold text-white uppercase mb-2">${item.name}</h3>
                        <span class="price-tag text-2xl font-bold text-orange-500 mb-4">${formatBRL(item.price)}</span>
                        <p class="text-gray-400 text-sm mb-6 flex-grow">${item.ingredients}</p>
                        ${item.isDrink ? `
                            <button onclick="addDrinkDirect('\${item.id}')" class="w-full py-3.5 bg-green-700 hover:bg-green-600 text-white rounded-xl font-bold uppercase">Adicionar Bebida</button>
                        ` : `
                            <button onclick="openCustomizationModal('\${item.id}')" class="w-full py-3.5 bg-green-700 hover:bg-green-600 text-white rounded-xl font-bold uppercase">Pedir & Personalizar</button>
                        `}
                    </div>
                </div>
            `).join('');
        }

        function openCustomizationModal(id) {
            const item = MENU_ITEMS.find(m => m.id === id);
            if (!item) return;
            currentModalItem = item;
            currentQuantity = 1;

            document.getElementById('modal-img').src = item.image;
            document.getElementById('modal-title').textContent = item.name;
            document.getElementById('modal-base-price').textContent = formatBRL(item.price);
            document.getElementById('modal-desc').textContent = item.ingredients;
            document.getElementById('modal-qty').textContent = currentQuantity;

            document.getElementById('modal-dynamic-options').innerHTML = `
                <div class="bg-black/40 p-4 rounded-xl border border-gray-800">
                    <label class="text-xs font-bold text-gray-300 uppercase">Ponto da Carne</label>
                    <div class="grid grid-cols-2 gap-2 mt-2">
                        <label class="p-2.5 rounded-lg bg-gray-900 border border-gray-800 cursor-pointer text-xs text-white">
                            <input type="radio" name="opt_meat" value="Ao Ponto" checked> Ao Ponto
                        </label>
                        <label class="p-2.5 rounded-lg bg-gray-900 border border-gray-800 cursor-pointer text-xs text-white">
                            <input type="radio" name="opt_meat" value="Bem Passada"> Bem Passada
                        </label>
                    </div>
                </div>
            `;

            updateModalTotal();
            document.getElementById('customize-modal').classList.add('active');
        }

        function updateModalTotal() {
            if (!currentModalItem) return;
            const total = currentModalItem.price * currentQuantity;
            document.getElementById('modal-total-price').textContent = formatBRL(total);
        }

        function changeModalQty(delta) {
            if (currentQuantity + delta >= 1) {
                currentQuantity += delta;
                document.getElementById('modal-qty').textContent = currentQuantity;
                updateModalTotal();
            }
        }

        function closeModal() {
            document.getElementById('customize-modal').classList.remove('active');
        }

        function confirmAddToCart() {
            if (!currentModalItem) return;
            cart.push({
                name: currentModalItem.name,
                unitPrice: currentModalItem.price,
                quantity: currentQuantity
            });
            closeModal();
            showToast("Adicionado à sacola!");
        }

        function openCart() { document.getElementById('cart-drawer').classList.add('open'); }
        function closeCart() { document.getElementById('cart-drawer').classList.remove('open'); }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderMenu();
        });
    </script>
</body>
</html>
